[package]
name = "primetiers-api"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.7", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
bson = "2"
tokio = { version = "1", features = ["io-util"] }
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
sha2 = "0.10"
pbkdf2 = "0.12"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
