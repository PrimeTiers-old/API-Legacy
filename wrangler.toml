name = "primetiers-api"
main = "build/worker/shim.mjs"
compatibility_date = "2025-01-01"

[build]
command = "cargo install -q worker-build --version 0.7.5 && worker-build --release"

[vars]
# Public Supabase project URL (not a secret).
SUPABASE_URL = "https://etrupginiwgbnygvczzs.supabase.co"
# Comma-separated browser origins allowed to call the API.
ALLOWED_ORIGINS = "https://primetiers.net"

# Secret (set with: npx wrangler secret put SUPABASE_ANON_KEY).
# Use the PUBLISHABLE/anon key only. Never the service-role key.
