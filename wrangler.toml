#:schema node_modules/wrangler/config-schema.json
name = "primetiers-api"
main = "build/worker/shim.mjs"
compatibility_date = "2025-01-01"
workers_dev = true

# Outbound TCP is required to reach MongoDB Atlas on port 27017.
compatibility_flags = []

# Custom domain. Requires primetiers.net to be a zone on this Cloudflare account.
[[routes]]
pattern = "api.primetiers.net"
custom_domain = true

# `wrangler deploy` runs this first, so the Worker is always built from source.
# worker-build 0.7.5 is pinned: 0.8.x fails in its wasm-bindgen step.
[build]
command = "cargo install -q worker-build --version 0.7.5 --locked && worker-build --release"

[observability]
enabled = true

[vars]
# MongoDB database name (not secret).
MONGODB_DB = "primetiers"
# Comma-separated browser origins allowed to call the API.
ALLOWED_ORIGINS = "https://primetiers.net,https://website.eufjbiasdjbfjasdf.workers.dev,http://localhost:5173"

# Secrets are not stored here. Set them with:
#   npx wrangler secret put MONGODB_URI
# The Atlas database user only needs read access to the primetiers database.
